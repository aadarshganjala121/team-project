<!DOCTYPE html>
<html>
  <head>
    <title>Survey Form</title>
  </head>
  <body>
    <form>
      <center>
      <fieldset style="width:44%; border: 44px solid orange; background-color: white;">
    <center><h1>Survey Form</h1></center>
    <center><h4>User Stories Survey Form</h4></center>

      <!-- Name Field -->
      <table align="center">
        <tr>
          <td align="left"><label for="Enter Name">Name</label></td>
          <td><input type="text" id="Enter Name" placeholder="Enter name"></td>
        </tr>

      <!-- E-Mail Field -->
        <tr>
          <td align="left"><label for="Enter E-Mail">E-Mail</label></td>
          <td><input type="text" id="Enter E-Mail" placeholder="Enter E-mail"></td>
        </tr>


      <!-- Work Experience Field -->
        <tr>
          <td align="left"><label for="Enter Number">Work Experience</label></td>
          <td><input type="text" id="Enter Number" placeholder="Enter Number"></td>
        </tr>

      <!-- Real Estate Investment -->
        <tr>
          <td align="left"><label>Are you comfortable in investing<br> in real-estate on platform without<br> first investing property?</label></td>
          <td>
            <select>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </td>
        </tr>

      <!-- Suggestions Field -->
        <tr>
          <td align="left"><label for="suggestions">Suggestions to build a trusted platform</label></td>
          <td><input type="text" id="suggestions"></td>
        </tr>

      <!-- Investment Options -->
        <tr>
          <td align="left"><label>You are ready to invest in:</label></td>
          <td>
            <input type="checkbox" name="option1"> Real estate<br>
            <input type="checkbox" name="option2"> Mutual funds<br>
            <input type="checkbox" name="option3"> Crypto currency<br>
            <input type="checkbox" name="option4"> Stocks and bonds<br><br>
          </td>
        </tr>

      <!-- Ready for Further Content -->
        <tr>
          <td align="left"><label>Are you ready for further content?</label></td>
          <td>
            <input type="radio" name="option" value="yes"> Yes<br>
            <input type="radio" name="option" value="no"> No
          </td>
        </tr>

      <!-- Submit Button -->
        <tr>
          <td colspan="2" align="center"><button type="submit" style="background-color: orange;">Submit</button></td>
        </tr>
      </table>
    </fieldset>
    </center>
    </form>

  </body>
</html>
